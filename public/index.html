<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ladybug Cloud Support</title>
<link rel="icon" href="https://ladybugcloud.xubi.org/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{--bg:#050a1a;--panel:#0a1330;--line:#17224a;--text:#e8eefc;--muted:#8a97bd;--blue:#2f6bff;--blue2:#5b8cff;--ok:#2ecc8f;--warn:#f5b84b;--bad:#ff5d6c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
header img{width:38px;height:38px;border-radius:10px}
header h1{font:700 17px 'Bricolage Grotesque',sans-serif;margin:0}
header small{color:var(--muted);display:block;font-size:12px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:12px;font:600 14px inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--blue2)}
.btn-primary{background:var(--blue);border-color:var(--blue)}
.btn-primary:hover{background:var(--blue2)}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--blue);align-self:flex-end;border-bottom-right-radius:4px}
.msg a{color:#9db9ff}
.msg code{background:#0d1a42;padding:1px 6px;border-radius:6px;font-size:13px}
.typing{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--blue2)}
form{display:flex;gap:8px;padding:12px 18px 18px;border-top:1px solid var(--line)}
input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:15px inherit;outline:none}
input[type=text]:focus{border-color:var(--blue2)}
.icon{width:46px;justify-content:center;padding:0}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:0 18px 12px}
.foot a{color:var(--muted)}
/* call overlay */
#call{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#0f2260,#050a1a 70%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:10;padding:24px;text-align:center}
#call.on{display:flex}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fb0ff,var(--blue) 55%,#14307f);box-shadow:0 0 0 0 rgba(47,107,255,.5);transition:transform .15s}
.orb.listening{animation:pulse 1.6s infinite}
.orb.thinking{animation:spin 1.2s linear infinite;filter:hue-rotate(40deg)}
.orb.speaking{animation:talk .5s ease-in-out infinite alternate;background:radial-gradient(circle at 35% 30%,#b6ffe0,var(--ok) 55%,#117a52)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,107,255,.55)}100%{box-shadow:0 0 0 46px rgba(47,107,255,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{to{transform:scale(1.12)}}
#callState{font:700 22px 'Bricolage Grotesque',sans-serif}
#callText{color:var(--muted);max-width:520px;min-height:48px;font-size:15px;line-height:1.5}
#callTimer{color:var(--muted);font-variant-numeric:tabular-nums}
.hang{background:var(--bad);border-color:var(--bad);width:64px;height:64px;border-radius:50%;font-size:26px;justify-content:center;padding:0}
.row{display:flex;gap:14px;align-items:center}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
body.embed header small,body.embed .foot{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="https://ladybugcloud.xubi.org/img/logo.png" alt="" />
    <div><h1>Ladybug Cloud Support<small>Ask Lady anything, by text or voice</small></h1></div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="callBtn" title="Talk to Lady by voice">&#128222; Call Lady</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form id="form">
    <button type="button" class="btn icon" id="micBtn" title="Dictate">&#127908;</button>
    <input type="text" id="input" placeholder="Type your question..." autocomplete="off" />
    <button class="btn btn-primary" type="submit">Send</button>
  </form>
  <div class="foot">AI assistant. It can't see your account. Need a human? <a id="adminLink" href="#" target="_blank" rel="noopener">Contact admin</a></div>
</div>

<div id="call" role="dialog" aria-label="Voice call">
  <div class="orb" id="orb"></div>
  <div id="callState">Connecting...</div>
  <div id="callText"></div>
  <div id="callTimer">00:00</div>
  <div class="row">
    <select id="lang" title="Speech language">
      <option value="en-US">English</option><option value="en-GB">English (UK)</option>
      <option value="sn-ZW">Shona</option><option value="nd-ZW">Ndebele</option>
      <option value="af-ZA">Afrikaans</option><option value="fr-FR">Fran&ccedil;ais</option>
      <option value="es-ES">Espa&ntilde;ol</option><option value="pt-PT">Portugu&ecirc;s</option>
    </select>
    <button class="btn hang" id="hangBtn" title="Hang up">&#9742;</button>
    <button class="btn" id="skipBtn" title="Interrupt Lady">Interrupt</button>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
if (params.get('embed')) document.body.classList.add('embed');
const log = $('#log'), input = $('#input');
let history = [];
let cfg = { ai: false, tts: false, stt: false, site: 'https://ladybugcloud.xubi.org' };

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/(https?:\/\/[^\s)<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function add(role, text){
  const d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
  d.innerHTML = role === 'user' ? esc(text) : md(text);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
async function ask(text, voice){
  history.push({role:'user', content:text});
  const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,voice:!!voice})});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error || 'Request failed');
  history.push({role:'assistant', content:j.reply});
  return j.reply;
}
async function send(text){
  text = text.trim(); if(!text) return;
  add('user', text); input.value = '';
  const t = add('bot', '...'); t.classList.add('typing');
  try { const reply = await ask(text,false); t.classList.remove('typing'); t.innerHTML = md(reply); }
  catch(e){ t.classList.remove('typing'); t.textContent = e.message; history.pop(); }
  log.scrollTop = log.scrollHeight;
}
$('#form').onsubmit = (e)=>{e.preventDefault(); send(input.value);};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canRecord = !!(navigator.mediaDevices && window.MediaRecorder);

/* ---------------- voice engine ---------------- */
function listenSR(lang, onInterim){
  return new Promise((resolve)=>{
    const rec = new SR(); rec.lang = lang; rec.interimResults = true; rec.continuous = false;
    let finalText = '', done = false;
    const fin = (v)=>{ if(done) return; done = true; try{rec.stop();}catch(e){} cur.stop = null; resolve(v); };
    rec.onresult = (ev)=>{ let interim=''; for(const r of ev.results){ if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; } onInterim && onInterim(finalText+interim); };
    rec.onerror = (ev)=>{ fin(ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? null : finalText); };
    rec.onend = ()=>fin(finalText);
    cur.stop = ()=>fin('');
    try{ rec.start(); }catch(e){ fin(''); }
  });
}
async function listenRecorder(onInterim){
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const ctx = new (window.AudioContext||window.webkitAudioContext)();
  const an = ctx.createAnalyser(); an.fftSize = 1024; ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize);
  const rec = new MediaRecorder(stream); const chunks = [];
  rec.ondataavailable = (e)=>chunks.push(e.data);
  const stopped = new Promise(r=>rec.onstop=r);
  rec.start();
  let spoke=false, lastVoice=Date.now(), start=Date.now(), stop=false;
  cur.stop = ()=>{stop=true;};
  while(!stop){
    await new Promise(r=>setTimeout(r,80));
    an.getByteTimeDomainData(buf);
    let sum=0; for(const v of buf){ const x=(v-128)/128; sum+=x*x; }
    const rms = Math.sqrt(sum/buf.length);
    if(rms>0.04){ spoke=true; lastVoice=Date.now(); }
    if(spoke && Date.now()-lastVoice>1200) break;
    if(!spoke && Date.now()-start>12000) break;
    if(Date.now()-start>30000) break;
  }
  cur.stop = null;
  rec.stop(); await stopped; stream.getTracks().forEach(t=>t.stop()); ctx.close();
  if(!spoke) return '';
  onInterim && onInterim('(transcribing...)');
  const fd = new FormData(); fd.append('audio', new Blob(chunks,{type:rec.mimeType}), 'audio.webm');
  const r = await fetch('/api/stt',{method:'POST',body:fd}); if(!r.ok) return '';
  return (await r.json()).text || '';
}
let cur = { stop: null, audio: null };
function listen(lang, onInterim){
  if(SR) return listenSR(lang,onInterim);
  if(canRecord && cfg.stt) return listenRecorder(onInterim);
  return Promise.resolve(null);
}
function speak(text, lang){
  return new Promise(async (resolve)=>{
    let ended = false; const end = ()=>{ if(!ended){ended=true; cur.audio=null; cur.skip=null; resolve();} };
    cur.skip = ()=>{ try{cur.audio&&cur.audio.pause();}catch(e){} speechSynthesis.cancel(); end(); };
    try{
      if(cfg.tts){
        const r = await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
        if(r.ok){ const url = URL.createObjectURL(await r.blob()); const a = new Audio(url); cur.audio = a; a.onended=end; a.onerror=end; await a.play(); return; }
      }
    }catch(e){}
    if(!('speechSynthesis' in window)) return end();
    const u = new SpeechSynthesisUtterance(text.replace(/[*`#]/g,'')); u.lang = lang; u.onend = end; u.onerror = end;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}

/* ---------------- call mode ---------------- */
let inCall = false, timerId = null, callStart = 0;
const setState = (cls, label, text)=>{ $('#orb').className = 'orb ' + cls; $('#callState').textContent = label; if(text !== undefined) $('#callText').textContent = text; };
async function startCall(){
  if(!SR && !(canRecord && cfg.stt)){ alert('Voice calls need Chrome, Edge or Safari (or the server must have speech-to-text enabled).'); return; }
  try{ const s = await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }catch(e){ alert('Microphone permission is required for a voice call.'); return; }
  inCall = true; $('#call').classList.add('on'); callStart = Date.now();
  timerId = setInterval(()=>{ const s = Math.floor((Date.now()-callStart)/1000); $('#callTimer').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); },500);
  const lang = $('#lang').value;
  setState('thinking','Connecting...','');
  const greet = "Hi, you've reached Ladybug Cloud support. I'm Lady. How can I help you today?";
  history.push({role:'assistant', content:greet}); add('assistant', greet);
  setState('speaking','Lady is speaking',greet); await speak(greet, lang);
  let silent = 0;
  while(inCall){
    setState('listening','Listening...','Go ahead, I\'m listening.');
    const heard = await listen($('#lang').value, (t)=>{ $('#callText').textContent = t; });
    if(!inCall) break;
    if(heard === null){ setState('thinking','Voice unavailable',''); break; }
    if(!heard.trim()){ if(++silent >= 4){ const bye = "I haven't heard anything, so I'll hang up now. Call again any time."; setState('speaking','Lady is speaking',bye); await speak(bye,$('#lang').value); break; } continue; }
    silent = 0;
    add('user', heard); setState('thinking','Thinking...', heard);
    let reply;
    try{ reply = await ask(heard, true); }catch(e){ reply = "Sorry, I'm having trouble right now. Please try again or contact the admin."; history.pop(); }
    if(!inCall) break;
    add('assistant', reply); setState('speaking','Lady is speaking', reply);
    await speak(reply, $('#lang').value);
  }
  endCall();
}
function endCall(){
  inCall = false; clearInterval(timerId);
  if(cur.stop) cur.stop(); if(cur.skip) cur.skip(); speechSynthesis.cancel();
  $('#call').classList.remove('on');
}
$('#callBtn').onclick = startCall;
$('#hangBtn').onclick = endCall;
$('#skipBtn').onclick = ()=>{ if(cur.skip) cur.skip(); };

/* dictation button: fills the text box */
$('#micBtn').onclick = async ()=>{
  const b = $('#micBtn'); b.style.borderColor='var(--ok)';
  const t = await listen($('#lang').value, (x)=>{ input.value = x; });
  b.style.borderColor=''; if(t) { input.value = t; send(t); }
};

/* init */
const suggestions = ['How do I link my WhatsApp number?','How much does it cost?','My bot stopped responding','How do I pay?','How do referrals work?'];
suggestions.forEach(s=>{ const c=document.createElement('button'); c.type='button'; c.className='chip'; c.textContent=s; c.onclick=()=>send(s); $('#chips').appendChild(c); });
fetch('/api/config').then(r=>r.json()).then(c=>{ cfg=c; $('#adminLink').href = c.site + '/#/support'; }).catch(()=>{});
add('assistant', "Hi, I'm Lady, Ladybug Cloud's support assistant. Ask me about pairing your bot, coins, pricing or payments. Tap **Call Lady** to talk by voice.");
</script>
</body>
</html>
