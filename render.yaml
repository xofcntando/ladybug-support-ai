services:
  - type: web
    name: ntandomods-ladybug-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Fill in ONE of these (leave the others empty). Advanced mode turns on automatically.
      - key: GROQ_API_KEY       # free: console.groq.com
        sync: false
      - key: GEMINI_API_KEY     # free: aistudio.google.com/apikey
        sync: false
      - key: OPENAI_API_KEY     # paid, best voice
        sync: false
      - key: SITE_URL
        value: https://ladybugcloud.xubi.org
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ESCALATION_WEBHOOK_URL
        sync: false          # optional Discord/Slack webhook
